<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Media Frame Studio PRO v2.3 Mobile Live</title>
    <style>
        :root { --primary: #3498db; --accent: #e74c3c; --bg: #0f0f0f; --panel: #1e1e1e; --text: #d1d1d1; --success: #2ecc71; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            overflow: hidden;
        }

        /* Видео-зона */
        .main-view { 
            flex: 0 0 auto; 
            background: #000; 
            border-bottom: 1px solid #333;
            z-index: 10;
        }

        .canvas-container { 
            width: 100%; 
            aspect-ratio: 16/9; 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            background: #050505;
        }
        
        canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
        #cropOverlay { position: absolute; border: 2px solid var(--primary); box-shadow: 0 0 0 9999px rgba(0,0,0,0.7); display: none; pointer-events: none; }

        /* Управление таймлайном */
        .timeline-box { padding: 12px; background: #1a1a1a; }
        #timeline { width: 100%; height: 30px; accent-color: var(--primary); margin: 0; cursor: pointer; }
        
        .time-info { 
            display: flex; 
            justify-content: space-between; 
            font-family: monospace; 
            font-size: 12px; 
            color: #888; 
            margin-bottom: 10px; 
        }

        .transport-controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .t-btn { 
            height: 50px; 
            font-size: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #333; 
            border: 1px solid #444; 
            border-radius: 8px; 
            color: white; 
            cursor: pointer;
            outline: none;
        }
        .btn-main { background: var(--primary); border: none; }

        /* Панель настроек */
        .side-panel { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            background: var(--panel); 
            -webkit-overflow-scrolling: touch;
        }

        h3 { margin: 0 0 15px 0; font-size: 14px; color: var(--primary); text-transform: uppercase; text-align: center; }
        
        .group { background: #262626; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 3px solid #444; }
        label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 10px; color: #888; }
        label span { color: var(--text); font-weight: bold; }

        /* Стили для ползунков */
        input[type="range"] { 
            width: 100%; 
            height: 35px; 
            accent-color: var(--primary); 
            margin-bottom: 5px;
        }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .btn { 
            background: #444; 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 6px; 
            font-size: 14px; 
            font-weight: bold; 
            cursor: pointer;
        }
        
        .btn-success { background: var(--success); width: 100%; height: 55px; margin-top: 10px; font-size: 16px; color: black; }

        select, input[type="file"], input[type="number"] { 
            width: 100%; 
            background: #333; 
            color: white; 
            border: 1px solid #444; 
            padding: 12px; 
            border-radius: 6px; 
            font-size: 16px;
            margin-bottom: 10px;
        }

        #histo { width: 100%; height: 40px; background: #000; border-radius: 4px; margin-top: 10px; }
        
        #status { 
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: var(--success); 
            color: black; 
            padding: 8px 20px; 
            border-radius: 20px; 
            font-weight: bold; 
            opacity: 0; 
            transition: 0.3s; 
            z-index: 100;
            pointer-events: none;
        }

        .flash { animation: flash-anim 0.15s ease-out; }
        @keyframes flash-anim { 0% { filter: brightness(3); } 100% { filter: brightness(1); } }

        @media (min-width: 768px) {
            body { flex-direction: row; }
            .main-view { flex: 1; height: 100vh; }
            .side-panel { width: 360px; flex: none; }
            .canvas-container { height: calc(100vh - 160px); aspect-ratio: auto; }
        }
    </style>
</head>
<body>

<div class="main-view">
    <div class="canvas-container" id="cvContainer">
        <canvas id="mainCanvas"></canvas>
        <div id="cropOverlay"></div>
    </div>
    
    <div class="timeline-box">
        <input type="range" id="timeline" step="0.00001" value="0" disabled>
        <div class="time-info">
            <span id="curTime">00:00.000</span>
            <span id="durTime">00:00.000</span>
        </div>
        
        <div class="transport-controls">
            <button class="t-btn" id="prevBtn">❮</button>
            <button class="t-btn" id="stopBtn">■</button>
            <button class="t-btn btn-main" id="playBtn">▶</button>
            <button class="t-btn" id="nextBtn">❯</button>
        </div>
    </div>
</div>

<div class="side-panel">
    <h3>Pro Studio v2.3 Live</h3>
    
    <div class="group">
        <label>Відеофайл</label>
        <input type="file" id="videoIn" accept="video/*">
    </div>

    <div class="group">
        <label>Корекція (Живе оновлення)</label>
        <label>Яскравість <span id="bV">100%</span></label>
        <input type="range" id="bright" min="0" max="200" value="100">
        
        <label>Контраст <span id="cV">100%</span></label>
        <input type="range" id="contrast" min="0" max="200" value="100">
        
        <label>Насиченість <span id="sV">100%</span></label>
        <input type="range" id="saturate" min="0" max="200" value="100">
        
        <canvas id="histo"></canvas>
    </div>

    <div class="group">
        <label>Кадрування</label>
        <div class="btn-grid">
            <button class="btn" onclick="setCrop(1)">1:1</button>
            <button class="btn" onclick="setCrop(16/9)">16:9</button>
            <button class="btn" onclick="setCrop(9/16)">9:16</button>
        </div>
        <button class="btn" style="width:100%; margin-top:10px; background:#333;" onclick="resetAllView()">Скинути вигляд</button>
    </div>

    <div class="group">
        <label>Експорт</label>
        <select id="fmt">
            <option value="image/jpeg">JPEG (High Quality)</option>
            <option value="image/png">PNG (Lossless)</option>
            <option value="image/webp">WebP</option>
        </select>
        <button class="btn btn-main btn-success" id="saveBtn">ЗБЕРЕГТИ КАДР</button>
    </div>

    <div class="group">
        <label>Пакетна нарізка</label>
        <input type="number" id="batchStep" value="3">
        <button class="btn" style="width:100%" id="batchBtn">Нарізати серію</button>
    </div>
</div>

<div id="status"></div>
<video id="videoHidden" crossorigin="anonymous" style="display:none;" playsinline></video>

<script>
    const video = document.getElementById('videoHidden');
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const timeline = document.getElementById('timeline');
    const overlay = document.getElementById('cropOverlay');
    const playBtn = document.getElementById('playBtn');
    const statusEl = document.getElementById('status');
    
    let cropRatio = null;
    let fps = 25; 
    let isRendering = false;

    function showStatus(text) {
        statusEl.innerText = text;
        statusEl.style.opacity = "1";
        setTimeout(() => statusEl.style.opacity = "0", 2000);
    }

    document.getElementById('videoIn').onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            video.src = URL.createObjectURL(file);
            showStatus("Відео завантажено");
        }
    };

    video.onloadedmetadata = () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        timeline.max = video.duration;
        timeline.disabled = false;
        document.getElementById('durTime').innerText = formatTime(video.duration);
        render();
    };

    function formatTime(s) {
        const m = Math.floor(s / 60);
        const sec = (s % 60).toFixed(2);
        return `${m.toString().padStart(2, '0')}:${sec.padStart(5, '0')}`;
    }

    // Основная функция отрисовки
    function render() {
        if (isRendering && !video.paused) return; // Предотвращаем перегрузку при игре
        
        const b = document.getElementById('bright').value;
        const c = document.getElementById('contrast').value;
        const s = document.getElementById('saturate').value;
        
        // Применяем фильтры
        ctx.filter = `brightness(${b}%) contrast(${c}%) saturate(${s}%)`;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Гистограмма только если видео на паузе (для экономии ресурсов мобилы)
        if (video.paused) drawHistogram();
        
        if (cropRatio) updateOverlay();
        
        document.getElementById('curTime').innerText = formatTime(video.currentTime);
        timeline.value = video.currentTime;
    }

    function drawHistogram() {
        const hCanvas = document.getElementById('histo');
        const hCtx = hCanvas.getContext('2d');
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let brights = new Uint32Array(256);
        for (let i = 0; i < data.length; i += 4) {
            brights[Math.round((data[i] + data[i+1] + data[i+2]) / 3)]++;
        }
        hCtx.clearRect(0, 0, hCanvas.width, hCanvas.height);
        hCtx.fillStyle = '#3498db';
        let max = Math.max(...brights);
        for (let i = 0; i < 256; i++) {
            let h = (brights[i] / max) * hCanvas.height;
            hCtx.fillRect(i * (hCanvas.width/256), hCanvas.height - h, 1, h);
        }
    }

    function step(dir) {
        video.pause();
        playBtn.innerText = "▶";
        video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + (dir * (1/fps))));
        // render вызовется автоматически по событию seeked
    }

    playBtn.onclick = () => {
        if (video.paused) { 
            video.play(); 
            playBtn.innerText = "⏸"; 
        } else { 
            video.pause(); 
            playBtn.innerText = "▶"; 
            render(); // Финальный рендер с гистограммой
        }
    };

    document.getElementById('stopBtn').onclick = () => {
        video.pause(); video.currentTime = 0; playBtn.innerText = "▶";
    };

    document.getElementById('nextBtn').onclick = () => step(1);
    document.getElementById('prevBtn').onclick = () => step(-1);

    video.onseeked = render;

    // Цикл анимации при проигрывании
    video.onplay = () => {
        const loop = () => { 
            if (!video.paused) { 
                render(); 
                requestAnimationFrame(loop); 
            } 
        };
        requestAnimationFrame(loop);
    };

    // Слушатели для ползунков (input срабатывает ПРИ ДВИЖЕНИИ)
    ['bright', 'contrast', 'saturate'].forEach(id => {
        const input = document.getElementById(id);
        input.addEventListener('input', () => {
            document.getElementById(id + 'V').innerText = input.value + '%';
            render(); // Мгновенное обновление кадра
        });
    });

    timeline.oninput = () => { 
        video.currentTime = timeline.value; 
        // render подхватит событие seeked
    };

    function setCrop(r) {
        cropRatio = r;
        overlay.style.display = r ? 'block' : 'none';
        render();
    }

    function updateOverlay() {
        const rect = canvas.getBoundingClientRect();
        const container = document.getElementById('cvContainer').getBoundingClientRect();
        let w = rect.width, h = rect.width / cropRatio;
        if (h > rect.height) { h = rect.height; w = h * cropRatio; }
        overlay.style.width = w + 'px';
        overlay.style.height = h + 'px';
        overlay.style.left = (rect.left - container.left + (rect.width - w) / 2) + 'px';
        overlay.style.top = (rect.top - container.top + (rect.height - h) / 2) + 'px';
    }

    function saveFrame() {
        if (!video.src) return;
        canvas.classList.remove('flash');
        void canvas.offsetWidth; 
        canvas.classList.add('flash');

        let out = canvas;
        if (cropRatio) {
            const tmp = document.createElement('canvas');
            const tCtx = tmp.getContext('2d');
            let sw = video.videoWidth, sh = video.videoWidth / cropRatio;
            if (sh > video.videoHeight) { sh = video.videoHeight; sw = sh * cropRatio; }
            tmp.width = sw; tmp.height = sh;
            tCtx.filter = ctx.filter;
            tCtx.drawImage(video, (video.videoWidth-sw)/2, (video.videoHeight-sh)/2, sw, sh, 0, 0, sw, sh);
            out = tmp;
        }
        const link = document.createElement('a');
        link.download = `studio_${video.currentTime.toFixed(2)}.jpg`;
        link.href = out.toDataURL(document.getElementById('fmt').value, 0.9);
        link.click();
        showStatus("Збережено!");
    }

    document.getElementById('saveBtn').onclick = saveFrame;
    
    document.getElementById('batchBtn').onclick = async () => {
        const num = parseInt(document.getElementById('batchStep').value);
        if(!video.src) return;
        showStatus(`Початок експорту: ${num} кадрів`);
        for(let i=0; i<num; i++) {
            video.currentTime = (video.duration / (num-1)) * i;
            await new Promise(r => video.onseeked = r);
            saveFrame();
            await new Promise(r => setTimeout(r, 500)); // Пауза для мобилы
        }
        showStatus("Готово!");
    };

    function resetAllView() {
        setCrop(null);
        document.getElementById('bright').value = 100;
        document.getElementById('contrast').value = 100;
        document.getElementById('saturate').value = 100;
        document.getElementById('bV').innerText = '100%';
        document.getElementById('cV').innerText = '100%';
        document.getElementById('sV').innerText = '100%';
        render();
        showStatus("Скинуто");
    }

    window.onresize = render;
</script>
</body>
</html>
